# Local development only, with hot reload.

# grpcurl also exits 0 on NOT_SERVING (shutting down), hence the grep.
x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "grpcurl -plaintext -import-path /protos -proto grpc/health/v1/health.proto 127.0.0.1:$${PORT} grpc.health.v1.Health/Check | grep -q '\"SERVING\"'"]
  start_period: 120s
  start_interval: 1s
  interval: 10s
  timeout: 3s
  retries: 3

services:
  productcatalogservice:
    container_name: productcatalogservice
    build:
      context: ./src/productcatalogservice
      dockerfile: Dockerfile.dev
      target: dev
    group_add:
      - "${DOCKER_GID:-989}"
    volumes:
      - ./protos:/protos:ro
      - ./src/productcatalogservice:/app
      - productcatalogservice_cache:/cache
    ports:
      - "3550:3550"
    environment:
      PORT: "3550"
      LOG_LEVEL: "debug"
    healthcheck: *healthcheck

  shippingservice:
    container_name: shippingservice
    build:
      context: ./src/shippingservice
      dockerfile: Dockerfile.dev
      target: dev
    group_add:
      - "${DOCKER_GID:-989}"
    volumes:
      - ./protos:/protos:ro
      - ./src/shippingservice:/app
      - shippingservice_cache:/cache
    ports:
      - "50051:50051"
    environment:
      PORT: "50051"
      LOG_LEVEL: "debug"
    healthcheck: *healthcheck

  paymentservice:
    container_name: paymentservice
    build:
      context: ./src/paymentservice
      dockerfile: Dockerfile.dev
      target: dev
    group_add:
      - "${DOCKER_GID:-989}"
    volumes:
      - ./protos:/protos:ro
      - ./src/paymentservice:/app
      - paymentservice_node_modules:/app/node_modules
    ports:
      - "50052:50052"
    environment:
      PORT: "50052"
      LOG_LEVEL: "debug"
    healthcheck: *healthcheck

  currencyservice:
    container_name: currencyservice
    build:
      context: ./src/currencyservice
      dockerfile: Dockerfile.dev
      target: dev
    group_add:
      - "${DOCKER_GID:-989}"
    volumes:
      - ./protos:/protos:ro
      - ./src/currencyservice:/app
      - currencyservice_node_modules:/app/node_modules
    ports:
      - "7000:7000"
    environment:
      PORT: "7000"
      LOG_LEVEL: "debug"
    healthcheck: *healthcheck

  emailservice:
    container_name: emailservice
    build:
      context: ./src/emailservice
      dockerfile: Dockerfile.dev
      target: dev
    group_add:
      - "${DOCKER_GID:-989}"
    volumes:
      - ./protos:/protos:ro
      - ./src/emailservice:/app
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "debug"
    healthcheck: *healthcheck

volumes:
  productcatalogservice_cache:
  shippingservice_cache:
  paymentservice_node_modules:
  currencyservice_node_modules:
