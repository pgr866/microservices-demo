plugins {
    id 'com.google.protobuf' version '0.10.0'
    id 'application'
    id 'jacoco'
    id 'checkstyle'
}

repositories {
    mavenCentral()
}

description = 'Ad Service'
group = "adservice"
version = "0.1.0-SNAPSHOT"

def javaVersion = 25
def grpcVersion = "1.84.0"
// gRPC 1.84.0 (its latest) still brings Netty 4.2.16, with CVE-2026-75595 and
// CVE-2026-59903/75596: the BOM raises every Netty module to the fixed version.
def nettyVersion = "4.2.18.Final"
def protocVersion = "4.36.2"
def guavaVersion = "33.7.1-jre"
def log4jVersion = "2.26.1"
def junitVersion = "6.1.3"
def jacocoVersion = "0.8.15"
def checkstyleVersion = "14.1.0"

application {
    mainClass = 'hipstershop.AdService'
    applicationName = 'AdService'
}

// Keep the install path the Dockerfile copies (build/install/hipstershop) independent of
// `applicationName`, which only names the start script.
distributions.main.distributionBaseName = 'hipstershop'

tasks.withType(JavaCompile).configureEach {
    options.release = javaVersion
    options.compilerArgs << "-Xlint:deprecation"
}

dependencies {
    implementation platform("io.netty:netty-bom:${nettyVersion}")
    implementation "io.grpc:grpc-protobuf:${grpcVersion}",
            "io.grpc:grpc-stub:${grpcVersion}",
            "io.grpc:grpc-netty:${grpcVersion}",
            "io.grpc:grpc-services:${grpcVersion}",
            "com.google.protobuf:protobuf-java:${protocVersion}",
            "com.google.guava:guava:${guavaVersion}",
            "org.apache.logging.log4j:log4j-core:${log4jVersion}"

    runtimeOnly "org.apache.logging.log4j:log4j-layout-template-json:${log4jVersion}"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

jacoco {
    toolVersion = jacocoVersion
}

jacocoTestReport {
    dependsOn test
    // Report only hand-written code — the protobuf plugin compiles the generated
    // protobuf/gRPC classes into `main` too, but they aren't ours to test.
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: ['hipstershop/Demo.class', 'hipstershop/Demo$*', 'hipstershop/*Grpc*'])
    }))
    reports {
        xml.required = true
    }
}

checkstyle {
    toolVersion = checkstyleVersion
    configFile = file("checkstyle.xml")
}

// Lint only hand-written code — the protobuf plugin adds the generated sources to `main`
// (needed for compilation), but those aren't ours to fix and shouldn't be linted.
checkstyleMain {
    source = fileTree("src/main/java")
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

// Resolves every library the app needs, so the production Dockerfile can cache them in a
// layer of their own before copying the source code.
tasks.register('downloadDependencies') {
    def classpaths = configurations.compileClasspath + configurations.runtimeClasspath
    doLast { classpaths.files }
}

// Extra start script for the test client, next to the `AdService` one `application` creates.
def adServiceClient = tasks.register('adServiceClient', CreateStartScripts) {
    mainClass = 'hipstershop.AdServiceClient'
    applicationName = 'AdServiceClient'
    outputDir = layout.buildDirectory.dir("clientScripts").get().asFile
    classpath = startScripts.classpath
}

distributions.main.contents {
    into('bin') {
        from(adServiceClient)
        filePermissions { unix(0755) }
    }
}
