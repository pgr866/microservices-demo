apiVersion: v1
kind: Pod
metadata:
  name: watch
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 12345
    runAsGroup: 12345
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: k6
      # The same k6 as the end-to-end tests (e2e/job.yaml).
      image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
      # Only the lines of watch.js: no progress bar, no summary, and none of k6's own logs, which
      # include a "Request Failed" warning for each request without an answer.
      args:
        - run
        - --quiet
        - --summary-mode=disabled
        - --no-color
        - --log-format=raw
        - --console-output=/dev/stdout
        - --log-output=none
        - watch.js
      workingDir: /watch
      env:
        - name: BASE_URL
          value: http://frontend
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      volumeMounts:
        - name: script
          mountPath: /watch
          readOnly: true
  volumes:
    - name: script
      configMap:
        name: watch-script
---
# For the hardened scenario's deny-all; harmless without it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: watch
spec:
  podSelector:
    matchLabels:
      app: watch
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 8082
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
